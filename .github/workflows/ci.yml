name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Hosted runners: with the repository public, minutes are free and the
    # matrix runs genuinely in parallel. A runner of our own on a public repo
    # would execute any fork's pull request on our own machine.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the floor the package declares; 24 is what most people are on.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # This repo is public and the platform it speaks to is not. Every batch of
      # client fixes is written by reading that platform, and the reading leaves
      # fingerprints — file names, internal function names — in doc comments
      # that SHIP, since dist/*.d.ts carries them to npm. OPL-4613 scrubbed
      # forty-one by hand and said the scan wanted to be a check; this is it
      # (OPL-4636).
      - run: npm run check:internals
      - run: npm run typecheck
      - run: npm run build
      # The surface diff is the second half of `npm test` and skips itself
      # here, where the platform repo is not checked out — deliberately, not
      # for want of a token. The platform's own CI checks this repo out beside
      # itself and runs the script there, where the diff it prints is not a
      # public log (OPL-3916). See scripts/check-surface.mjs.
      - run: npm test
