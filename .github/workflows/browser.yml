name: Browser integration
on:
  pull_request:
  push:
    branches: [main]
jobs:
  chromium:
    # Pinned (OPL-6333): Playwright does not yet support chromium on Ubuntu
    # 26.04, which ubuntu-latest became. Move back once it does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Exercise the browser toolset against Chromium
        run: |
          export MANDALA_TEST_CHROMIUM="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')"
          npx vitest run test/browser-toolset.test.ts test/browser-files.test.ts
